---

name: Reverse Dependencies
run-name: Reverse Dependencies (test)
on:
  workflow_dispatch:

jobs:
  stanheaders-revdeps:
    uses: andrjohns/ci-scripts/.github/workflows/revdeps.yml@revdeps
    with:
      package: StanHeaders
      stanheaders-source: v2.39.0
      rstantools-source: compat
      
  rstan-revdeps:
    uses: andrjohns/ci-scripts/.github/workflows/revdeps.yml@revdeps
    with:
      package: rstan
      rstan-source: v2.39.0
      stanheaders-source: v2.39.0
      rstantools-source: compat
      
  rstantools-revdeps:
    uses: andrjohns/ci-scripts/.github/workflows/revdeps.yml@revdeps
    with:
      package: rstantools
      rstantools-source: compat
      
  loo-revdeps:
    uses: andrjohns/ci-scripts/.github/workflows/revdeps.yml@revdeps
    with:
      package: loo
      loo-source: master
      
  posterior-revdeps:
    uses: andrjohns/ci-scripts/.github/workflows/revdeps.yml@revdeps
    with:
      package: posterior
      posterior-source: master
      
  bayesplot-revdeps:
    uses: andrjohns/ci-scripts/.github/workflows/revdeps.yml@revdeps
    with:
      package: bayesplot
      bayesplot-source: master
